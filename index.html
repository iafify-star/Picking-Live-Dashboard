<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noon minutes · Picking Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <img src="assets/noon-minutes-logo.png" alt="noon minutes" class="logo-img" />
      <div class="brand-copy">
        <h1>Picking Live Dashboard</h1>
        <p>Every user · every hour · quantity and SKU count</p>
      </div>
    </div>
    <div class="live-wrap">
      <div class="live-pill" id="livePill">
        <span class="dot"></span>
        <span id="liveText">LIVE</span>
      </div>
      <div class="meta" id="metaLine">Fetching data from the sheet...</div>
      <button id="refreshBtn" type="button">Refresh now</button>
    </div>
  </header>

  <section class="toolbar">
    <label class="field">
      <span>From date</span>
      <input id="dateFrom" type="date" />
    </label>
    <label class="field">
      <span>To date</span>
      <input id="dateTo" type="date" />
    </label>
    <button id="allDaysBtn" class="ghost" type="button">All dates</button>
    <label class="field grow">
      <span>Search user</span>
      <input id="searchInput" type="search" placeholder="Type a username or name..." />
    </label>
    <label class="field">
      <span>Sort by</span>
      <select id="sortSelect">
        <option value="qty">Highest quantity</option>
        <option value="skus">Highest SKU count</option>
        <option value="name">Name</option>
      </select>
    </label>
    <div class="countdown" id="countdown">Refreshing in 60s</div>
  </section>
  <div class="day-chips" id="dayChips"></div>

  <section class="kpis" id="kpis"></section>

  <section class="panel matrix-panel">
    <div class="panel-head">
      <div>
        <h2>Hourly Productivity per User</h2>
      </div>
      <div class="head-actions">
        <button id="exportBtn" type="button">Download Excel</button>
        <div class="count-chip" id="userCount">0</div>
      </div>
    </div>
    <div class="table-wrap matrix-wrap">
      <table class="matrix" id="matrixTable">
        <thead id="matrixHead"></thead>
        <tbody id="userBody"></tbody>
        <tfoot id="matrixFoot"></tfoot>
      </table>
    </div>
  </section>

  <footer>
    Designed by Ibrahim Afify
  </footer>

  <script src="app.js"></script>
</body>
</html>
